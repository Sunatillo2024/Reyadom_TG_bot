name: reyadom-audit

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: reyadom_audit_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:55439:5432"
    cpus: 1.0
    mem_limit: 1536m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d reyadom_audit_test"]
      interval: 2s
      timeout: 2s
      retries: 20
    labels:
      purpose: isolated-synthetic-audit

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:56389:6379"
    cpus: 0.1
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    labels:
      purpose: isolated-synthetic-audit

  runner:
    image: reyadom_tg_bot-bot:latest
    profiles: ["runner"]
    working_dir: /audit
    volumes:
      - .:/audit:ro
      - ./audit_results:/results
    environment:
      PYTHONPATH: /audit
      PYTHONDONTWRITEBYTECODE: "1"
      AUDIT_DATABASE_URL: postgresql+asyncpg://postgres@postgres:5432/reyadom_audit_test
      AUDIT_REDIS_URL: redis://redis:6379/15
      AUDIT_ISOLATED: "1"
    cpus: 0.9
    mem_limit: 1280m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    labels:
      purpose: isolated-synthetic-audit

networks:
  default:
    # Loopback-only published ports permit the host pytest environment to connect.
    internal: false
