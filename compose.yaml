services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ryadom_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1212
    ports:
      - "55432:5432"
    volumes:
      - ryadom-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ryadom_bot"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:1212@postgres:5432/ryadom_bot
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  ryadom-postgres-data:
